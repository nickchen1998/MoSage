# ─────────────────────────────────────────────────────────────
# 這本書的設定
# 通常由 AI 在「立項訪談」時幫你填好；你也可以直接修改。
# 沒寫的欄位會沿用專案根目錄 mosage.yaml 的設定。
# ─────────────────────────────────────────────────────────────

# 類型：book（書）、thesis（論文）、other（其他長篇寫作）
type: book

# 目前階段：kickoff（立項）→ outline（大綱）→ writing（撰寫）→ revising（修訂）→ done（完稿）
stage: kickoff

title: ""
subtitle: ""
# author: ""           # 不填則使用 mosage.yaml 的 author

# 目標字數（中文字 + 英文單字），用來顯示進度；0 表示不設定
targetWords: 0

# 章節順序：列出 chapters/ 資料夾裡的檔名。
# 沒有列在這裡的檔案會顯示為「未排入目錄的草稿」，不會匯出。
chapters: []

# ai:
#   editMode: suggest   # 覆寫專案設定：suggest（修改建議）或 direct（直接修改）

# Word 匯出設定（沒寫的欄位依類型套用預設值：
# 書 — 新細明體 12pt、1.5 倍行距；論文 — 標楷體 12pt、左邊界 3 公分）
export:
  pageSize: A4 # A4 | A5 | B5 | Letter，或 { width: 170, height: 230 }（公釐）
  # fontSize: 12         # 內文字級（pt）
  # lineSpacing: 1.5     # 行距（倍數）
  # firstLineIndent: 2   # 段落首行縮排（字元數）
  # fonts:
  #   body: 新細明體      # 中文內文字型
  #   latin: Times New Roman
  #   heading: 微軟正黑體
  #   code: Consolas
  # margins: { top: 25, bottom: 25, left: 25, right: 25 } # 公釐
  # titlePage: true      # 書名頁
  # toc: true            # 目錄（在 Word 開啟時自動更新頁碼）
  # header: title        # 頁首：none | title（書名）| chapter（章名）
