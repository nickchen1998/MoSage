# ─────────────────────────────────────────────────────────────
# MoSage 專案設定
# 一個專案可以放很多本書（books/ 底下每個資料夾就是一本書或一篇論文）。
# 這裡的設定是所有書的預設值；每本書可以在自己的 book.yaml 覆寫。
# ─────────────────────────────────────────────────────────────

author: ""
language: zh-TW

# 書架的排列順序（books/ 底下的資料夾名稱）；沒列到的排在後面
books: []

ai:
  # AI 修改「已經寫好的文字」時的方式：
  #   suggest — 以修改建議呈現，你在介面上按「接受」才會生效（建議使用）
  #   direct  — 直接修改檔案（仍會自動保留版本紀錄）
  editMode: suggest

# 所有書共用的 Word 匯出設定（例如統一字型），每本書的 book.yaml 可以再覆寫
export: {}
#  fonts:
#    body: 新細明體
#    latin: Times New Roman
