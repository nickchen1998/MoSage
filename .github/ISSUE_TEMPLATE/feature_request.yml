name: Feature request
description: Suggest a new capability for MoSage.
title: "[Feature]: "
labels: ["request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that MoSage makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? API sketches, screenshots, or example usage are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried or other approaches you've thought about.
  - type: dropdown
    id: scope
    attributes:
      label: Which part would this affect?
      multiple: true
      options:
        - "Runtime (viewer, flow pagination, design panel)"
        - "Export (PDF, Word, HTML, PNG)"
        - "CLI and project template (mosage init / dev / check)"
        - Agent skills (create-doc, doc-authoring, create-theme, apply-comments)
        - Docs / README
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
