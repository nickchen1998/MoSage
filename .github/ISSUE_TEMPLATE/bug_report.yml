name: Bug report
description: Report a problem with the open-doc runtime, CLI, MCP server, or scaffolder.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the sections below so we can reproduce it quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
      placeholder: When I export a document to PDF, the running footer…
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal, numbered steps. A link to a repo or sandbox is ideal.
      placeholder: |
        1. `npx @open-doc/cli init repro`
        2. `cd repro && pnpm dev`
        3. Open http://localhost:5173, open the document and …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include screenshots, stack traces, or console output if relevant. For layout bugs, the exported PDF helps more than a screenshot of the viewer.
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Affected package
      description: e.g. `@open-doc/core`, `@open-doc/cli`, `@open-doc/mcp`, or "scaffolded project".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npm ls @open-doc/core` (or the CLI version you ran).
      placeholder: "@open-doc/core@0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, package manager, OS, browser (if it's a viewer or export bug).
      placeholder: "Node 24.3.0, pnpm 11.9.0, macOS 15.5, Chrome 140"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else worth knowing — page size, theme, recent upgrades, related issues, workarounds tried.
