name: npm deprecate

# Mark a published version as deprecated (or clear it with an empty message):
# Actions → npm deprecate → Run workflow.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Package and version range, e.g. mosage@0.1.0
        required: true
      message:
        description: Deprecation message shown on install (empty clears it)
        required: false

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: npm deprecate
        run: npm deprecate "$SPEC" "$MESSAGE"
        env:
          SPEC: ${{ inputs.spec }}
          MESSAGE: ${{ inputs.message }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
